url: https://andreweatherman.github.io/gtUtils/
template:
  bootstrap: 5
  light-switch: false
  bslib:
    base_font:
      google: Jost
    heading_font:
      google: Oswald
    code_font:
      google: JetBrains Mono
    # deep navy on warm paper, burnt-orange accent
    bg: "#FBFAF7"
    fg: "#12263F"
    primary: "#C24A0C" # links + buttons, ~4.6:1 on paper
    danger: "#A6081A"
    border-radius: 0.5rem
    btn-border-radius: 0.375rem
  twitter:
    creator: '@andreweatherman'
    card: summary_large_image
navbar:
  structure:
    left:
    - reference
    - articles
    - news
    right:
    - search
    - github
home:
  title: gtUtils R Package
  sidebar: false
reference:
- title: Annotations
  desc: Functions for table annotations
  contents:
  - gt_538_caption
  - gt_cutline
  - gt_marginalia
  - gt_column_subheaders
  - gt_social_tag
  - gt_title_header
  - gt_watermark
- title: Coloring
